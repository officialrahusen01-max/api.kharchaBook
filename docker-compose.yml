services:
  app:
    build: .
    volumes:
      - uploads-data:/app/uploads
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./kharchabook-68337-firebase.json}:/run/secrets/firebase-service-account.json:ro
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-Asia/Kolkata}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads-data:
