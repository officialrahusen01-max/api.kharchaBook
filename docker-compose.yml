services:
  app:
    build: .
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb+srv://rahulsen2003:e8wnt3vcgb@cluster0.k74riut.mongodb.net/kharchaBook
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads-data:
